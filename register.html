
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlogSpace | Register</title>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fc;
            color: #172554;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        nav {
            background: #102a56;
            color: white;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .logo { font-size: 25px; font-weight: bold; }

        nav a { color: white; text-decoration: none; }

        .container {
            width: min(450px, calc(100% - 32px));
            margin: 35px auto;
            padding: 30px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 5px 25px #0f172a12;
        }

        h1 { text-align: center; margin-bottom: 8px; }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
        }

        .form-group { margin-bottom: 17px; }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #93c5fd;
            border-color: #2563eb;
        }

        .btn {
            width: 100%;
            padding: 13px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        .btn:hover { background: #1d4ed8; }

        #message {
            margin-top: 15px;
            text-align: center;
            overflow-wrap: anywhere;
        }

        .bottom {
            text-align: center;
            margin-top: 20px;
            color: #475569;
        }

        .bottom a { color: #2563eb; font-weight: bold; }

        footer {
            margin-top: auto;
            padding: 20px;
            background: #102a56;
            color: white;
            text-align: center;
        }

        @media (max-width: 480px) {
            .container { padding: 24px 19px; }
        }
    </style>
</head>

<body>
    <nav>
        <div class="logo">BlogSpace.</div>
        <a href="index.html">← Home</a>
    </nav>

    <main class="container">
        <h1>Create Account</h1>
        <p class="subtitle">Join our community of writers.</p>

        <form id="registerForm">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" required
                       minlength="2" maxlength="80"
                       autocomplete="name"
                       placeholder="Enter your full name">
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" required
                       autocomplete="email"
                       placeholder="you@example.com">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required
                       minlength="8" autocomplete="new-password"
                       placeholder="At least 8 characters">
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" required
                       minlength="8" autocomplete="new-password"
                       placeholder="Enter password again">
            </div>

            <button class="btn" type="submit">Create Account</button>
            <p id="message" role="status" aria-live="polite"></p>
        </form>

        <p class="bottom">
            Already have an account? <a href="login.html">Login</a>
        </p>
    </main>

    <footer>
        <p>&copy; 2026 BlogSpace. All rights reserved.</p>
    </footer>
    
<script>
    const form = document.getElementById("registerForm");
    const password = document.getElementById("password");
    const confirmPassword = document.getElementById("confirmPassword");
    const message = document.getElementById("message");

    form.addEventListener("submit", function (event) {
        event.preventDefault();

        if (!form.checkValidity()) {
            form.reportValidity();
            return;
        }

        if (password.value !== confirmPassword.value) {
            message.textContent = "Passwords do not match.";
            message.className = "message error";
            return;
        }

        const profile = {
            name: document.getElementById("name").value.trim(),
            email: document.getElementById("email").value.trim().toLowerCase()
        };

        try {
            localStorage.setItem(
                "blogspace_demo_profile",
                JSON.stringify(profile)
            );

            message.textContent =
                "Demo profile saved! Redirecting to login...";
            message.className = "message success";

            window.location.href = "login.html";
        } catch (error) {
            message.textContent =
                "Browser storage is unavailable. Please try again.";
            message.className = "message error";
        }
    });
</script>  
</body>
</html>
